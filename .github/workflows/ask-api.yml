name: Ask API

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/ask-api.yml'
  push:
    branches: ['main']
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/ask-api.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pytest backend/tests -q
      - run: python -m pytest backend/tests/evals -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run build

  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-bicep@v2
      - run: bicep build infrastructure/main.bicep

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, frontend-build, validate-infrastructure]
    runs-on: ubuntu-latest
    environment: azure-dev
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-bicep@v2
      - run: az deployment group create --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' --template-file infrastructure/main.bicep --parameters @infrastructure/parameters/dev.bicepparam apiImage='${{ vars.ASK_API_IMAGE }}' postgresAdministratorPassword='${{ secrets.POSTGRES_ADMIN_PASSWORD }}'
